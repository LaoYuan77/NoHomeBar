从你的报错截图可以看到，编译卡在了 Command SwiftGeneratePch failed with a nonzero exit code（退出代码 65）。

为什么会报这个错？
这是因为 GitHub 目前最新的云端服务器运行的是 Xcode 26.6（iPhoneOS26.5.sdk），而原作者的项目是 4 年前用 Xcode 14 创建的：

Xcode 26.6 在预编译旧版桥接头文件 NoHomeBar-Bridging-Header.h（即 SwiftGeneratePch 步骤）时，不再允许直接指定 iOS 14.0（截图中可以看到 Clang 自动把运行时重置成了 -fobjc-runtime=ios-26.5.0，与 Swift 的 14.0 发生冲突报错）。

原版 vm_unaligned_copy_switch_race.c 缺少 <unistd.h> 和 <string.h> 头文件声明，在新版 Xcode 严格模式下也会被拦截。

