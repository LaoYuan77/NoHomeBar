不行这软件装上闪退

装上一点开就秒闪退，原因非常明确：

为什么刚才那个包在 iOS 14.3 上会闪退？
缺少 iOS 15 才有的 Swift 系统库：GitHub 服务器上的 Xcode 26.6 在以 15.0 编译 SwiftUI 代码时，会自动强行绑定 /usr/lib/swift/libswift_Concurrency.dylib（这是 iOS 15.0 才加入系统的动态库）。你的手机是 iOS 14.3，系统里没有这个库文件，所以一点图标就会在启动阶段被系统 dyld 直接拦截闪退。

新版链接器指针格式不兼容 iOS 14.3：新版 Xcode 默认生成的链式重定向格式（Chained Fixups）以及新版方法调用桩（Selector Stubs）在 iOS 14.3 上也会触发启动崩溃。

彻底根治闪退：纯原生 Objective-C (UIKit) 重构版 build.yml
为了彻底消除新版 Xcode 编译 Swift 在 iOS 14.3 上的兼容性闪退，我直接把整个软件重构成了纯原生 Objective-C (UIKit) + C 语言版本（完全不依赖任何 Swift / SwiftUI 运行库），并加上了针对 iOS 14.3 的 -miphoneos-version-min=14.0、-Wl,-no_fixup_chains 和 -fno-objc-msgsend-selector-stubs 编译参数，全部内置在下面这个新的 build.yml 中：

