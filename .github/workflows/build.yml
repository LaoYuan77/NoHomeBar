                  const char *expStr = [expected UTF8String];
                  for (int i = 0; i < 100; i++) {
                      touch_and_keep_page_alive(kTargetAssetPath, expStr);
                      usleep(200000);
                  }
              });
          }

          - (void)onActionButtonTapped {
              bool disabled = check_is_succeeded(kTargetAssetPath);
              if (!disabled) {
                  [self applyOverwriteWithHeader:@"xxx"];
              } else {
                  UIAlertController *alert = [UIAlertController alertControllerWithTitle:@"恢复小白条？"
                                                                                 message:@"确定要恢复系统默认小白条吗？"
                                                                          preferredStyle:UIAlertControllerStyleAlert];
                  [alert addAction:[UIAlertAction actionWithTitle:@"取消" style:UIAlertActionStyleCancel handler:nil]];
                  [alert addAction:[UIAlertAction actionWithTitle:@"恢复" style:UIAlertActionStyleDestructive handler:^(UIAlertAction * _Nonnull action) {
                      [self applyOverwriteWithHeader:@"BOM"];
                  }]];
                  [self presentViewController:alert animated:YES completion:nil];
              }
          }

          - (void)applyOverwriteWithHeader:(NSString *)header {
              self.targetHeader = header;
              self.logLabel.text = @"正在覆写并锁定 16KB 内存页...";
              UIImpactFeedbackGenerator *gen = [[UIImpactFeedbackGenerator alloc] initWithStyle:UIImpactFeedbackStyleHeavy];
              [gen impactOccurred];
              [self startBackgroundPageGuard];

              dispatch_async(dispatch_get_global_queue(DISPATCH_QUEUE_PRIORITY_HIGH, 0), ^{
                  NSString *lastMsg = @"";
                  const char *cHeader = [header UTF8String];
                  for (int pass = 0; pass < 4; pass++) {
                      overwrite_target_file(kTargetAssetPath, cHeader, &lastMsg);
                      touch_and_keep_page_alive(kTargetAssetPath, cHeader);
                      if (pass < 3) {
                          usleep(120000);
                      }
                  }
                  dispatch_async(dispatch_get_main_queue(), ^{
                      self.logLabel.text = lastMsg;
                      [self updateStatusUI];
                      [self showRespringAlert];
                  });
              });
          }

          - (void)showRespringAlert {
              UIAlertController *alert = [UIAlertController alertControllerWithTitle:@"内存页已锁定"
                                                                             message:@"• 推荐方式（iOS 14 最稳）：点击「保持后台锁定」，直接切回桌面打开 TrollStore 点击 Respring。\n• 内置方式：点击「立即注销桌面」。"
                                                                      preferredStyle:UIAlertControllerStyleAlert];
              [alert addAction:[UIAlertAction actionWithTitle:@"保持后台锁定 (去巨魔注销)" style:UIAlertActionStyleDefault handler:^(UIAlertAction * _Nonnull action) {
                  [self startBackgroundPageGuard];
              }]];
              [alert addAction:[UIAlertAction actionWithTitle:@"立即注销桌面 (Restart)" style:UIAlertActionStyleDestructive handler:^(UIAlertAction * _Nonnull action) {
                  [self performRespring];
              }]];
              [self presentViewController:alert animated:YES completion:nil];
          }

          - (void)performRespring {
              NSString *expected = self.targetHeader ?: @"xxx";
              dispatch_async(dispatch_get_global_queue(DISPATCH_QUEUE_PRIORITY_HIGH, 0), ^{
                  const char *expStr = [expected UTF8String];
                  while (1) {
                      touch_and_keep_page_alive(kTargetAssetPath, expStr);
                      usleep(10000);
                  }
              });

              const char *killPaths[] = {"/usr/bin/killall", "/var/jb/usr/bin/killall"};
              for (int i = 0; i < 2; i++) {
                  if (access(killPaths[i], X_OK) == 0) {
                      pid_t pid = 0;
                      char *argv[] = {(char *)killPaths[i], "-9", "SpringBoard", "backboardd", NULL};
                      posix_spawn(&pid, killPaths[i], NULL, NULL, argv, NULL);
                  }
              }

              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(0.15 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                  UIWindow *window = [UIApplication sharedApplication].windows.firstObject;
                  if (window) {
                      while (1) {
                          [window snapshotViewAfterScreenUpdates:NO];
                      }
                  }
              });
          }

          @end

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (nonatomic, strong) UIWindow *window;
          @end

          @implementation AppDelegate
          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];
              self.window.rootViewController = [[MainViewController alloc] init];
              [self.window makeKeyAndVisible];
              return YES;
          }
          @end

          int main(int argc, char * argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class]));
              }
          }
          OBJCSRC

      - name: Compile Native iOS 14.0 ARM64 Binary & Package IPA
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p Payload/NoHomeBar.app

          EXTRA_FLAGS=""
          for FLAG in "-Wl,-no_fixup_chains" "-fno-objc-msgsend-selector-stubs"; do
            if xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK_PATH" $FLAG -x c - -o /tmp/test_flag <<< 'int main(){return 0;}' 2>/dev/null; then
              EXTRA_FLAGS="$EXTRA_FLAGS $FLAG"
              rm -f /tmp/test_flag
            fi
          done
          echo "Using EXTRA_FLAGS=${EXTRA_FLAGS}"

          COMPILED=0
          for MIN_IOS in 14.0 15.0 16.0; do
            if xcrun --sdk iphoneos clang \
              -arch arm64 \
              -isysroot "$SDK_PATH" \
              -miphoneos-version-min=${MIN_IOS} \
              -fobjc-arc \
              -O2 \
              $EXTRA_FLAGS \
              -Wno-error \
              -Wno-int-conversion \
              -Wno-implicit-function-declaration \
              -Wno-deprecated-declarations \
              NoHomeBar/vm_unaligned_copy_switch_race.c \
              NoHomeBar/main.m \
              -framework UIKit \
              -framework Foundation \
              -framework CoreGraphics \
              -framework QuartzCore \
              -framework AudioToolbox \
              -lpthread \
              -o Payload/NoHomeBar.app/NoHomeBar; then
              echo "Compiled successfully with -miphoneos-version-min=${MIN_IOS}"
              COMPILED=1
              break
            fi
          done
          if [ "$COMPILED" -ne 1 ]; then
            exit 1
          fi

          chmod +x Payload/NoHomeBar.app/NoHomeBar

          cp NoHomeBar/Assets.xcassets/AppIcon.appiconset/60.png Payload/NoHomeBar.app/AppIcon60x60@2x.png || true
          cp NoHomeBar/Assets.xcassets/AppIcon.appiconset/180.png Payload/NoHomeBar.app/AppIcon60x60@3x.png || true

          cat << 'PLIST' > Payload/NoHomeBar.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleDisplayName</key>
              <string>NoHomeBar</string>
              <key>CFBundleExecutable</key>
              <string>NoHomeBar</string>
              <key>CFBundleIdentifier</key>
              <string>com.straight-tamago.NoHomeBar</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>NoHomeBar</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>0.6</string>
              <key>CFBundleVersion</key>
              <string>2</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>14.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
              <key>UIUserInterfaceStyle</key>
              <string>Dark</string>
              <key>CFBundleIcons</key>
              <dict>
                  <key>CFBundlePrimaryIcon</key>
                  <dict>
                      <key>CFBundleIconFiles</key>
                      <array>
                          <string>AppIcon60x60</string>
                      </array>
                  </dict>
              </dict>
          </dict>
          </plist>
          PLIST

          plutil -convert binary1 Payload/NoHomeBar.app/Info.plist

          if command -v vtool >/dev/null 2>&1; then
            vtool -set-build-version ios 14.0 16.0 -replace \
              -output Payload/NoHomeBar.app/NoHomeBar \
              Payload/NoHomeBar.app/NoHomeBar || true
          fi

          otool -L Payload/NoHomeBar.app/NoHomeBar || true

          codesign --force --deep --sign - --digest-algorithm=sha1,sha256 Payload/NoHomeBar.app || codesign --force --deep --sign - Payload/NoHomeBar.app
          zip -r9 NoHomeBar-Optimized.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoHomeBar-Optimized-IPA
          path: NoHomeBar-Optimized.ipa
