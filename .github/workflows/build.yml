name: Build NoHomeBar IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Pure Objective-C & C Sources for iOS 14.3
        run: |
          cat << 'CHEADER' > NoHomeBar/vm_unaligned_copy_switch_race.h
          #pragma once
          #include <stdlib.h>
          #include <stdbool.h>
          #include <stdint.h>
          #include <sys/types.h>
          #include <unistd.h>
          #include <string.h>

          bool unaligned_copy_switch_race(int file_to_overwrite, off_t file_offset, const void* overwrite_data, size_t overwrite_length);
          CHEADER

          python3 -c 'import pathlib; p = pathlib.Path("NoHomeBar/vm_unaligned_copy_switch_race.c"); s = p.read_text(); h = "#include <unistd.h>\n#include <string.h>\n#include <stdlib.h>\n#include <time.h>\n#include <sys/types.h>\n"; s = (h + s if "<unistd.h>" not in s else s).replace("ro_addr = file_mapped;", "ro_addr = (vm_address_t)file_mapped;"); p.write_text(s)'

          cat << 'OBJCSRC' > NoHomeBar/main.m
          #import <UIKit/UIKit.h>
          #import <AudioToolbox/AudioToolbox.h>
          #include <fcntl.h>
          #include <sys/mman.h>
          #include <sys/stat.h>
          #include <unistd.h>
          #include <pthread.h>
          #include <spawn.h>
          #include <string.h>
          #include <stdlib.h>
          #include "vm_unaligned_copy_switch_race.h"

          static const char *kTargetAssetPath = "/System/Library/PrivateFrameworks/MaterialKit.framework/Assets.car";
          static void *g_locked_ptr = NULL;
          static size_t g_locked_size = 0;
          static int g_locked_fd = -1;
          static pthread_mutex_t g_lock_mutex = PTHREAD_MUTEX_INITIALIZER;
          static pthread_mutex_t g_overwrite_mutex = PTHREAD_MUTEX_INITIALIZER;

          static bool check_is_succeeded(const char *path) {
              int fd = open(path, O_RDONLY | O_CLOEXEC);
              if (fd < 0) return false;
              uint8_t buf[3] = {0, 0, 0};
              ssize_t n = read(fd, buf, 3);
              close(fd);
              return (n == 3 && buf[0] == 0x78 && buf[1] == 0x78 && buf[2] == 0x78);
          }

          static bool overwrite_target_file(const char *path, const char *overwrite_str, NSString **outMsg) {
              pthread_mutex_lock(&g_overwrite_mutex);
              size_t data_len = strlen(overwrite_str);
              size_t page_size = 0x4000;
              int rnum = arc4random_uniform(90) + 10;

              int fd = open(path, O_RDONLY | O_CLOEXEC);
              if (fd < 0) {
                  if (outMsg) *outMsg = [NSString stringWithFormat:@"open Error - %d", rnum];
                  pthread_mutex_unlock(&g_overwrite_mutex);
                  return false;
              }

              struct stat st;
              size_t map_size = page_size;
              if (fstat(fd, &st) == 0 && st.st_size > 0 && (size_t)st.st_size < page_size) {
                  map_size = (size_t)st.st_size;
              }

              void *mapped = mmap(NULL, map_size, PROT_READ, MAP_SHARED, fd, 0);
              if (mapped == MAP_FAILED) {
                  close(fd);
                  if (outMsg) *outMsg = [NSString stringWithFormat:@"mmap Error - %d", rnum];
                  pthread_mutex_unlock(&g_overwrite_mutex);
                  return false;
              }

              mlock(mapped, map_size);

              pthread_mutex_lock(&g_lock_mutex);
              if (g_locked_ptr != NULL && g_locked_ptr != MAP_FAILED) {
                  munmap(g_locked_ptr, g_locked_size);
              }
              if (g_locked_fd >= 0) {
                  close(g_locked_fd);
              }
              g_locked_ptr = mapped;
              g_locked_size = map_size;
              g_locked_fd = fd;
              pthread_mutex_unlock(&g_lock_mutex);

              bool ok = false;
              for (int attempt = 0; attempt < 6; attempt++) {
                  bool race_ok = unaligned_copy_switch_race(fd, 0, overwrite_str, data_len);
                  if (race_ok && memcmp(mapped, overwrite_str, data_len) == 0) {
                      mlock(mapped, map_size);
                      ok = true;
                      break;
                  }
                  usleep(50000);
              }

              if (outMsg) {
                  *outMsg = ok ? [NSString stringWithFormat:@"Success (Page Locked) - %d", rnum]
                               : [NSString stringWithFormat:@"Retry Failed - %d", rnum];
              }
              pthread_mutex_unlock(&g_overwrite_mutex);
              return ok;
          }

          static void touch_and_keep_page_alive(const char *path, const char *expected_str) {
              size_t expected_len = strlen(expected_str);
              pthread_mutex_lock(&g_lock_mutex);
              if (g_locked_ptr != NULL && g_locked_size > 0) {
                  volatile uint8_t *p = (volatile uint8_t *)g_locked_ptr;
                  uint8_t acc = 0;
                  for (size_t i = 0; i < g_locked_size; i += 64) {
                      acc ^= p[i];
                  }
                  (void)acc;
                  mlock(g_locked_ptr, g_locked_size);
              }
              pthread_mutex_unlock(&g_lock_mutex);

              int fd = open(path, O_RDONLY | O_CLOEXEC);
              if (fd >= 0) {
                  char buf[8] = {0};
                  ssize_t n = read(fd, buf, expected_len);
                  close(fd);
                  if (n == (ssize_t)expected_len && memcmp(buf, expected_str, expected_len) != 0) {
                      overwrite_target_file(path, expected_str, NULL);
                  }
              }
          }

